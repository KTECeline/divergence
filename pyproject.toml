[build-system]
requires = ["setuptools>=77"]   # SPDX licence string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "divergence-agt"
version = "0.2.1"
description = "Intent-behaviour consistency scoring for AI agent skills: a pre-install check that extends the Agent Governance Toolkit (AGT) marketplace installer. Research prototype."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Celine Khaw" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
# Runtime only: what the evaluator, the AGT installer extension and the CLI import.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "transformers>=4.41",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
    "agent-governance-toolkit-core==4.1.0",   # pinned: AGT renames packages between releases
]

[project.urls]
Homepage = "https://github.com/KTECeline/divergence"
Model = "https://huggingface.co/KTECeline/divergence-minilm-l6"

[project.optional-dependencies]
# Everything needed to reproduce the research (training, experiments, notebooks)
research = [
    "pandas>=2.2",
    "datasets",                # SetFit-style fine-tuning uses sentence-transformers' trainer,
    "accelerate>=0.20.3",      # which needs these two; the setfit library itself is not used
    "requests",                # LLM-as-judge baseline and Exp 5c rewrites (local Ollama)
    "statsmodels>=0.14",
    "jupyter",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = ["pytest>=8.0"]

[project.scripts]
divergence = "divergence.cli:main"

[tool.setuptools.packages.find]
include = ["divergence*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
